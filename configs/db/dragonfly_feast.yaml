write_batch_size: 100000
measurement_time_secs: 30
warmup_time_secs: 2
sample_size: 50
backend:
  redis:
    image: "docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0"
    command: ["dragonfly", "--logtostderr", "--max_multi_bulk_len=1000000"]
    wait_log: "AcceptServer - listening on"
    read_mode: hgetall
    # cgroup_memory_mb: 4096            # cap container RAM; omit = unlimited
